name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # v24: el runtime con el que está verificado localmente; hace falta
          # la detección de sintaxis ESM de los .js (node --check + import dinámico)
          node-version: '24'

      - name: Sintaxis de los scripts JS
        run: |
          set -e
          for f in js/data/studyData.js \
                   js/data/resourcesData.js \
                   js/pages/study/resourcesModel.js \
                   js/pages/study/dashboard.js \
                   js/pages/study/resources.js \
                   tools/validate-resources.js \
                   tools/validate-activities.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validador de recursos (sin pérdidas ni duplicados)
        run: node tools/validate-resources.js

      - name: Validador de actividades interactivas
        run: node tools/validate-activities.js
