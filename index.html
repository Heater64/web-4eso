<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Web - 4ESO</title>
    <meta name="description" content="Material de 4.º ESO: apuntes, ejercicios, exámenes y recursos por asignatura y tema.">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="color-scheme" content="dark light">

    <!-- Theme bootstrap: resuelve modo antes de renderizar (sin flash de color) -->
    <script>
      (function() {
        var MODOS = ['dark', 'light', 'contrast'];
        var modo = localStorage.getItem('web4eso.modo');
        var resolved = MODOS.indexOf(modo) > -1 ? modo : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved === 'contrast' ? 'dark' : resolved;
        var meta = document.head.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content',
            resolved === 'light' ? '#F8FAFC' : (resolved === 'contrast' ? '#000000' : '#0B1220'));
        }
      })();
    </script>

    <!-- ===== FUENTES ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fraunces: display con carácter para títulos (h1–h3) · Inter: cuerpo e interfaz -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="./css/00-tokens.css?v=5">
    <link rel="stylesheet" href="./css/study.css?v=5">

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/%3E%3Cpath d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/%3E%3C/svg%3E">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="study-navbar" aria-label="Principal">
        <a href="#/" class="logo" id="logoLink">
            <span class="logo-mark" aria-hidden="true">📚</span>
            <span class="logo-text">Web - 4ESO</span>
        </a>

        <!-- ===== BUSCADOR ===== -->
        <form class="study-search" id="searchForm" role="search">
            <label class="sr-only" for="searchInput">Buscar en la web</label>
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input type="search" id="searchInput" placeholder="Buscar mates, geometría, pomodoro..." autocomplete="off">
            <button type="button" class="search-clear" id="searchClear" aria-label="Borrar búsqueda">✕</button>
            <button type="submit" class="search-btn" id="searchBtn">Buscar</button>
        </form>

        <div class="nav-links">
            <a href="#/" id="navHome">Inicio</a>
            <a href="#/asignaturas" id="navSubjects">Asignaturas</a>
            <a href="#/recursos" id="navResources">Recursos</a>
            <button type="button" id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
        </div>
    </nav>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main id="studyContent" tabindex="-1">
        <div class="loading-placeholder">
            <span aria-hidden="true">📚</span>
            <h1>Cargando contenido...</h1>
            <p>Por favor, espera un momento.</p>
        </div>
    </main>

    <!-- ===== SCRIPTS ===== -->
    <script src="./js/data/studyData.js?v=5"></script>
    <script src="./js/data/resourcesData.js?v=5"></script>
    <script src="./js/pages/study/resourcesModel.js?v=5"></script>
    <script src="./js/pages/study/dashboard.js?v=5"></script>
    <script src="./js/pages/study/resources.js?v=5"></script>

</body>
</html>
