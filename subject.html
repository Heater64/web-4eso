<head>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">Web 4 ESO</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <span class="sidebar-section-title">Menú</span>
                    <ul class="sidebar-menu">
                        <li><a href="dashboard.html" class="sidebar-item" id="dashboard-nav-link">
                            <span class="sidebar-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg></span>
                            <span class="sidebar-item-text">Dashboard</span>
                        </a></li>
                        <li><a href="#" class="sidebar-item" id="subjects-nav-link">
                            <span class="sidebar-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></span>
                            <span class="sidebar-item-text">Asignaturas</span>
                        </a></li>
                        <li><a href="https://sites.google.com/view/entornosdesarrollopsg/" class="sidebar-item" id="entornos-nav-link" target="_blank" rel="noopener">
                            <span class="sidebar-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></span>
                            <span class="sidebar-item-text">Entornos</span>
                            <span style="margin-left: auto; font-size: 12px; opacity: 0.7;">↗</span>
                        </a></li>
                    </ul>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar" id="sidebar-user-avatar">U</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebar-user-name">Usuario</div>
                        <div class="sidebar-user-role" id="sidebar-user-role">Estudiante</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="topbar-menu-btn" id="menu-btn" aria-label="Abrir menú">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <div id="breadcrumb"></div>
                </div>
                
                <div class="topbar-center">
                    <div class="topbar-search">
                        <span class="topbar-search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                        <input type="search" class="topbar-search-input" id="topbar-search-input" placeholder="Buscar temas... (Ctrl+K)">
                    </div>
                </div>
                
                <div class="topbar-right">
                    <button class="btn btn-ghost btn-icon" id="expand-all-btn" title="Expandir todos los temas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <button class="btn btn-ghost btn-icon" id="collapse-all-btn" title="Colapsar todos los temas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>
                    <button class="btn btn-ghost btn-icon" id="logout-btn" title="Cerrar sesión">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                    <div class="topbar-user">
                        <div class="topbar-user-info">
                            <div class="topbar-user-name" id="topbar-user-name">Usuario</div>
                            <div class="topbar-user-role" id="topbar-user-role">Estudiante</div>
                        </div>
                        <div class="avatar" id="topbar-user-avatar">U</div>
                    </div>
                </div>
            </header>
            
            <div class="page-content">
                <div class="subject-hero" id="subject-hero">
                    <div class="skeleton" style="height: 160px;"></div>
                </div>
                
                <section class="subjects-section">
                    <div class="section-header">
                        <h2 class="section-title">Temas de la asignatura</h2>
                        <button class="btn btn-primary" id="add-topic-btn" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Nuevo Tema
                        </button>
                    </div>
                    <div class="topics-list" id="topics-list">
                        <div class="skeleton skeleton-card"></div>
                        <div class="skeleton skeleton-card"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <div class="toast-container"></div>
    
    <!-- Core Scripts -->
    <script src="js/core/supabase.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/ui.js"></script>
    
    <!-- Modules -->
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/comments.js"></script>
    <script src="js/modules/topics.js"></script>
    <script src="js/modules/files.js"></script>
    <script src="js/modules/recommendations.js"></script>
    
    <!-- Render -->
    <script src="js/pages/render.js"></script>
    
    <!-- Subject Page Scripts -->
    <script src="js/pages/subject/init.js"></script>
    <script src="js/pages/subject/actions.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('DOM loaded, initializing...');
            try {
                await window.EducaSupabase.init();
                await window.AuthModule.init();
                
                const user = window.AuthModule.getUser();
                console.log('User:', user);
                
                if (!user) {
                    console.log('No user, redirecting to login');
                    window.location.href = 'login.html';
                    return;
                }
                
                console.log('Calling initSubject...');
                if (typeof window.initSubject === 'function') {
                    await window.initSubject();
                    console.log('initSubject completed');
                } else {
                    console.error('window.initSubject is not a function!');
                }
            } catch (error) {
                console.error('Error:', error);
                if (window.Utils) window.Utils.showNotification('Error al cargar la página: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
